name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# GitHub's default is `bash -e`, which lets a broken pipe stage pass silently.
defaults:
  run:
    shell: bash

env:
  MIX_ENV: local
  ELIXIR_VERSION: "1.20.1"
  OTP_VERSION: "29.0.2"
  # OTP 29+ dropped 32-bit Windows ERTS; 28.5.0.2 is the last line with a
  # win32 build. The x86 installer is compiled AND bundled on this OTP.
  OTP_VERSION_WIN32: "28.5.0.2"
  ZIG_VERSION: "0.15.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── CI first ────────────────────────────────────────────────────────────
  # A push to release has no PR event, so the PR-only CI workflow would not
  # re-run. Call it here: red format/tests stop the version gate, Fly, and
  # the half-hour installers from ever starting.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # ── Version gate ────────────────────────────────────────────────────────
  # The version guard costs seconds; the builds cost half an hour. Ask the
  # cheap question first, so a forgotten version bump fails before the fleet
  # spins up. needs: ci — never cut a tag from a red suite.
  prepare:
    name: Version gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from mix.exs
        id: version
        run: |
          # awk, not grep|head|sed: under pipefail head closes the pipe early
          # and the whole step dies on a SIGPIPE that means nothing.
          VERSION=$(awk -F'"' '/^ *version: *"/ {print $2; exit}' mix.exs)
          test -n "$VERSION" || { echo "::error::Could not read version from mix.exs"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version in mix.exs before pushing to release."
            exit 1
          fi

  # ── Production web ──────────────────────────────────────────────────────
  # The web app and the desktop installers are two products of one commit,
  # sharing no artifact — so the site ships beside the builds, not behind
  # them. fly.toml already names thedojo; -a is belt and braces.
  # Default (rolling) strategy: prod gets a handover, not a gap.
  deploy_prod:
    name: Deploy to Fly (thedojo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy
        run: |
          flyctl deploy --remote-only \
            --wait-timeout 600 \
            -c fly.toml -a thedojo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PROD_API_TOKEN }}

  # ── 32-bit Windows ──────────────────────────────────────────────────────
  # Built in isolation on OTP 28.5.0.2 (see OTP_VERSION_WIN32). Burrito's
  # default ERTS resolver fetches otp_win32_<host-OTP>.exe, so running this
  # job on OTP 28 yields a consistent win32 ERTS + OTP-28 bytecode. The
  # resulting installer is handed to the publish job as an artifact.
  build_win32:
    name: Build Windows 32-bit installer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zig
          key: zig-linux-x86_64-${{ env.ZIG_VERSION }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/zig
          ZIG_URL=$(curl -fsSL --retry 3 --retry-delay 2 https://ziglang.org/download/index.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['${{ env.ZIG_VERSION }}']['x86_64-linux']['tarball'])")
          echo "Downloading Zig from: $ZIG_URL"
          curl -fSL --retry 3 --retry-delay 2 "$ZIG_URL" | tar -xJ --strip-components=1 -C ~/.local/zig
          ~/.local/zig/zig version

      - name: Add Zig to PATH
        run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Setup Erlang & Elixir (OTP 28 for win32)
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION_WIN32 }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      # ~/.hex holds the package tarballs, so a miss on deps/ still resolves
      # offline-fast. Keyed per OTP: the two jobs must not share a build.
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.hex
          key: deps-${{ runner.os }}-otp${{ env.OTP_VERSION_WIN32 }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-otp${{ env.OTP_VERSION_WIN32 }}-

      # The sha suffix means every run saves a fresh entry and every run
      # restores the nearest one — incremental compile without a key that
      # has to guess which sources matter.
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build/local
          key: build-win32-${{ runner.os }}-otp${{ env.OTP_VERSION_WIN32 }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            build-win32-${{ runner.os }}-otp${{ env.OTP_VERSION_WIN32 }}-${{ hashFiles('mix.lock') }}-
            build-win32-${{ runner.os }}-otp${{ env.OTP_VERSION_WIN32 }}-

      # Burrito downloads an ERTS tarball per target and stores it by name.
      # Cached, the wrap step stops pulling ~100MB from erlang.org each run.
      - name: Cache Burrito ERTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/burrito_file_cache
          key: burrito-erts-win32-otp${{ env.OTP_VERSION_WIN32 }}-${{ hashFiles('mix.lock') }}
          restore-keys: burrito-erts-win32-otp${{ env.OTP_VERSION_WIN32 }}-

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq nsis xz-utils

      - name: Download VC++ Redistributable (x86)
        run: |
          curl -fSL --retry 3 --retry-delay 2 -o rel/packaging/resources/VC_redist.x86.exe \
            "https://aka.ms/vs/17/release/vc_redist.x86.exe"
          ls -lh rel/packaging/resources/VC_redist.x86.exe

      - name: Install Elixir dependencies
        run: |
          mix local.hex --if-missing --force
          mix local.rebar --if-missing --force
          mix deps.get --only $MIX_ENV

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Build assets
        run: mix assets.deploy

      - name: Build 32-bit Windows release
        env:
          BURRITO_WIN32: "1"
        run: mix release

      - name: Verify 32-bit installer
        run: |
          ls -lh burrito_out
          # a glob, not `ls | head` — that pipe dies of SIGPIPE under pipefail
          shopt -s nullglob
          INSTALLERS=(burrito_out/PaperLandDojo-*-windows-x86-setup.exe)
          test ${#INSTALLERS[@]} -gt 0 || { echo "::error::Missing Windows x86 (32-bit) installer"; exit 1; }
          echo "Built: ${INSTALLERS[0]}"

      - name: Upload 32-bit installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86-installer
          path: burrito_out/PaperLandDojo-*-windows-x86-setup.exe
          if-no-files-found: error
          retention-days: 1
          # installers are already compressed; re-zipping only burns time
          compression-level: 0

  # ── Everything else ─────────────────────────────────────────────────────
  # Linux, both macOS targets, and 64-bit Windows on the current OTP. Runs
  # beside build_win32 rather than after it — the two share no artifact, so
  # serialising them only doubled the wall clock.
  build_main:
    name: Build Linux, macOS & Windows 64-bit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/zig
          key: zig-linux-x86_64-${{ env.ZIG_VERSION }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/zig
          ZIG_URL=$(curl -fsSL --retry 3 --retry-delay 2 https://ziglang.org/download/index.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['${{ env.ZIG_VERSION }}']['x86_64-linux']['tarball'])")
          echo "Downloading Zig from: $ZIG_URL"
          curl -fSL --retry 3 --retry-delay 2 "$ZIG_URL" | tar -xJ --strip-components=1 -C ~/.local/zig
          ~/.local/zig/zig version

      - name: Add Zig to PATH
        run: echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Setup Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.hex
          key: deps-${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-otp${{ env.OTP_VERSION }}-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build/local
          key: build-local-${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: |
            build-local-${{ runner.os }}-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}-
            build-local-${{ runner.os }}-otp${{ env.OTP_VERSION }}-

      - name: Cache Burrito ERTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/burrito_file_cache
          key: burrito-erts-otp${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: burrito-erts-otp${{ env.OTP_VERSION }}-

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq nsis genisoimage xz-utils

      - name: Download VC++ Redistributable (x64)
        run: |
          curl -fSL --retry 3 --retry-delay 2 -o rel/packaging/resources/VC_redist.x64.exe \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          ls -lh rel/packaging/resources/VC_redist.x64.exe

      - name: Install Elixir dependencies
        run: |
          mix local.hex --if-missing --force
          mix local.rebar --if-missing --force
          mix deps.get --only $MIX_ENV

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Build assets
        run: mix assets.deploy

      - name: Build release
        run: mix release

      - name: Rename Linux binary to its conventional name
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd burrito_out
          [ -f dojo_linux ] && mv dojo_linux "dojo-${VERSION}-linux-x86_64"
          echo "=== Built here ==="
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: main-artifacts
          path: |
            burrito_out/dojo-*-linux-x86_64
            burrito_out/PaperLandDojo-*-windows-x86_64-setup.exe
            burrito_out/PaperLandDojo-*-macos-*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ── Publish ─────────────────────────────────────────────────────────────
  # No compiler here: gather the five artifacts, check they are all present,
  # sign, tag, release. Minutes, not half an hour.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, build_win32, build_main]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: burrito_out
          merge-multiple: true

      - name: Verify artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ls -lh burrito_out
          test -f "burrito_out/dojo-${VERSION}-linux-x86_64" || { echo "::error::Missing Linux binary"; exit 1; }
          test -f "burrito_out/PaperLandDojo-${VERSION}-windows-x86_64-setup.exe" || { echo "::error::Missing Windows x86_64 installer"; exit 1; }
          test -f "burrito_out/PaperLandDojo-${VERSION}-windows-x86-setup.exe" || { echo "::error::Missing Windows x86 (32-bit) installer"; exit 1; }
          test -f "burrito_out/PaperLandDojo-${VERSION}-macos-x86_64.dmg" || { echo "::error::Missing macOS x86_64 DMG"; exit 1; }
          test -f "burrito_out/PaperLandDojo-${VERSION}-macos-arm64.dmg" || { echo "::error::Missing macOS ARM64 DMG"; exit 1; }
          echo "All artifacts verified."

      - name: Sign Windows artifacts (optional)
        if: ${{ vars.CODE_SIGNING_ENABLED == 'true' }}
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_KEY: ${{ secrets.CODE_SIGN_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sudo apt-get install -yq osslsigncode
          echo "$CODE_SIGN_CERT" | base64 -d > /tmp/cert.pem
          echo "$CODE_SIGN_KEY" | base64 -d > /tmp/key.pem
          for LABEL in x86_64 x86; do
            INSTALLER="burrito_out/PaperLandDojo-${VERSION}-windows-${LABEL}-setup.exe"
            [ -f "$INSTALLER" ] || { echo "Skipping sign — $INSTALLER not found"; continue; }
            osslsigncode sign -certs /tmp/cert.pem -key /tmp/key.pem \
              -n "PaperLand Dojo" -t http://timestamp.digicert.com \
              -in "$INSTALLER" -out "${INSTALLER}.signed"
            mv "${INSTALLER}.signed" "$INSTALLER"
          done
          rm -f /tmp/cert.pem /tmp/key.pem

      - name: Create git tag
        run: |
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Dojo $TAG" \
            --generate-notes \
            "burrito_out/dojo-${VERSION}-linux-x86_64" \
            "burrito_out/PaperLandDojo-${VERSION}-windows-x86_64-setup.exe" \
            "burrito_out/PaperLandDojo-${VERSION}-windows-x86-setup.exe" \
            "burrito_out/PaperLandDojo-${VERSION}-macos-x86_64.dmg" \
            "burrito_out/PaperLandDojo-${VERSION}-macos-arm64.dmg"
